name: Peter Opportunity Radar - Hourly Cloud Scan

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hourly-radar-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Multi-Source Scraper & Evidence Scoring Engine
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PWA_BASE_URL: ${{ secrets.PWA_BASE_URL }}
        run: |
          python engine/hourly_runner.py

      - name: Commit Updated Live Feed JSON
        run: |
          git config user.name "PeterRadarBot"
          git config user.email "bot@users.noreply.github.com"
          git add data/live_feed.json data/gmail_queue.json
          git diff --staged --quiet || git commit -m "chore(radar): hourly opportunity scan update"
          git push
